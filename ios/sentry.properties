# Sentry config for iOS debug-symbol (dSYM) + sourcemap uploads.
# NOTE: do NOT put the auth token here. sentry-cli reads it from the
# SENTRY_AUTH_TOKEN environment variable (keep it in CI secrets / your shell).
#
# Fill in your org/project slugs (or set SENTRY_ORG / SENTRY_PROJECT env vars).
defaults.url=https://openlittermap.sentry.io/
defaults.org=openlittermap
defaults.project=openlittermap
